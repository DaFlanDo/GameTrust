services:
  web:
    build: .
    ports:
      - "5050:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
      FERNET_SECRET_KEY: ${FERNET_SECRET_KEY:?задайте FERNET_SECRET_KEY в .env}
      DATABASE_URL: postgresql://gametrust:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/gametrust
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      SEED_DEMO: ${SEED_DEMO:-1}
      # Кнопки «Войти как …» без пароля и защита общих демо-аккаунтов
      DEMO_MODE: ${DEMO_MODE:-1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gametrust
      POSTGRES_USER: gametrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametrust -d gametrust"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
