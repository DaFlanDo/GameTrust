name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pyflakes
      - run: python -m pyflakes app.py config.py demo.py escrow.py extensions.py media.py models.py seed.py totp2fa.py forms.py routes tests
      - run: python -m pytest -q tests

  postgres:
    # Миграции и демо-данные на той же СУБД, что в docker compose
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gametrust
          POSTGRES_USER: gametrust
          POSTGRES_PASSWORD: gametrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gametrust" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gametrust:gametrust@localhost:5432/gametrust
      SECRET_KEY: ci-secret
      FERNET_SECRET_KEY: fCo3kw8Dr6E0LxV2Hk2gq0TQ1mG6rYlU7mQe0w1bS9w=
      FLASK_APP: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flask db upgrade
      - run: flask seed
      - name: Схема в базе совпадает с моделями
        run: flask db check
      - name: Ночной сброс демо-стенда на настоящей базе
        run: flask reset-demo && flask db check
        env:
          DEMO_MODE: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gametrust .
